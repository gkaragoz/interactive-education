<!doctype html>
<meta charset="utf-8">
<title>Organelle texture viewer</title>
<style>html,body{margin:0;background:#f4ead6;height:100%;overflow:hidden}#i{position:fixed;left:8px;top:6px;font:12px monospace;color:#533}</style>
<div id="i">loading</div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Dev viewer for contract v2: ?id=nucleus&tier=medium&lod=0&cut=1&tex=1&view=iso   (serve the repo root, e.g. `npx vite` or python -m http.server)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const id = q.get('id') ?? 'nucleus', tier = q.get('tier') ?? 'medium', lod = Number(q.get('lod') ?? 0);
const useTex = q.get('tex') !== '0';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4ead6);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xfff2dd, 2.4);
key.position.set(-3, 5, 4);
scene.add(key);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 500);
const ktx2 = new KTX2Loader().setTranscoderPath('/node_modules/three/examples/jsm/libs/basis/').detectSupport(renderer);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const meta = await (await fetch(`/public/models/organelles/${id}.meta.json`)).json();
const gltf = await loader.loadAsync(`/public/models/organelles/${id}.glb`);
const root = gltf.scene;
root.traverse((o) => { if (/^LOD\d$/.test(o.name)) o.visible = o.name === `LOD${lod}`; });
const maps = {};
async function tex(mat, kind, srgb) {
  const t = await ktx2.loadAsync(`/public/textures/${id}/${tier}/${mat}_${kind}.ktx2`);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8;
  return t;
}
const planes = q.get('cut') ? [new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)] : [];
renderer.localClippingEnabled = true;
for (const m of new Set([...root.children.flatMap((c) => c.children.flatMap((d) => d.material ? [d.material] : [])), ...(() => { const a = []; root.traverse((o) => o.material && a.push(o.material)); return a; })()])) {
  const mat = m.name.endsWith('_gel') ? 'gel' : 'clay';
  m.vertexColors = !useTex;
  if (useTex && meta.textures) {
    const [a, n, o] = await Promise.all([tex(mat, 'albedo', true), tex(mat, 'normal', false), tex(mat, 'orm', false)]);
    m.map = a; m.normalMap = n; m.normalScale.set(1, -1);   // GLB has no TANGENT: three derives the frame from UV derivatives and needs y negated (GLTFLoader does the same)
    m.roughnessMap = o; m.aoMap = o; m.aoMapIntensity = 0.8; m.roughness = 1; m.metalness = 0;
    m.color.set(0xffffff);
    if (mat === 'gel') { m.transparent = true; m.depthWrite = false; }
  }
  if (mat === 'gel' && !useTex) { m.transparent = true; m.opacity = 0.5; }
  m.side = THREE.DoubleSide;
  m.clippingPlanes = planes;
  m.needsUpdate = true;
}
root.traverse((o) => { if (o.isMesh && o.geometry.attributes.uv && !o.geometry.attributes.uv1) o.geometry.setAttribute('uv1', o.geometry.attributes.uv); });
scene.add(root);
const r = meta.boundsRadius;
const dirs = { iso: [0.6, 0.5, 0.65], side: [0, 0.1, 1], top: [0, 1, 0.1], back: [-0.6, 0.4, -0.7] };
const d = new THREE.Vector3(...(dirs[q.get('view') ?? 'iso'])).normalize().multiplyScalar(r * 3.3);
cam.position.copy(d);
cam.lookAt(0, 0, 0);
renderer.render(scene, cam);
document.getElementById('i').textContent = `${id} ${tier} LOD${lod} ${useTex ? 'textured' : 'vertex colours'}`;
window.__done = true;
</script>
